<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Streaming Service</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b10;
    color: #f5f7fa;
    font-family: Arial, sans-serif;
}

button,
input {
    font: inherit;
}

.hidden {
    display: none !important;
}

#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at top, #18253b 0%, #080b10 55%);
}

.login-box {
    width: 100%;
    max-width: 420px;
    padding: 38px;
    background: rgba(18, 23, 32, 0.95);
    border: 1px solid #293241;
    border-radius: 22px;
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
}

.logo {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.subtitle {
    color: #8e9aaa;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #303948;
    background: #0d1219;
    color: white;
    outline: none;
}

input:focus {
    border-color: #5b8cff;
}

button {
    border: 0;
    cursor: pointer;
}

.primary {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border-radius: 12px;
    background: #5b8cff;
    color: white;
    font-weight: 700;
}

.primary:hover {
    background: #719cff;
}

.error {
    margin-top: 14px;
    color: #ff7272;
    min-height: 20px;
}

#app {
    min-height: 100vh;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(8,11,16,.92);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid #202733;
}

.nav {
    max-width: 1400px;
    margin: auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.brand {
    font-size: 21px;
    font-weight: 800;
    white-space: nowrap;
}

.search {
    max-width: 420px;
    margin-left: auto;
}

.logout {
    padding: 10px 15px;
    border-radius: 10px;
    background: #171d27;
    color: #dce3ed;
}

main {
    max-width: 1400px;
    margin: auto;
    padding: 35px 24px 80px;
}

.page-title {
    font-size: 34px;
    margin: 0 0 8px;
}

.page-description {
    color: #8e9aaa;
    margin-bottom: 32px;
}

.section {
    margin-top: 38px;
}

.section-title {
    font-size: 24px;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
}

.card {
    background: #11161e;
    border: 1px solid #242c38;
    border-radius: 17px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s ease, border-color .2s ease;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #526a91;
}

.poster {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #181e28;
}

.card-body {
    padding: 17px;
}

.card-title {
    font-weight: 700;
    font-size: 17px;
}

.card-description {
    margin-top: 8px;
    color: #8994a5;
    font-size: 14px;
    line-height: 1.5;
}

.season-list {
    display: grid;
    gap: 12px;
}

.season {
    padding: 17px 19px;
    border-radius: 13px;
    border: 1px solid #252e3b;
    background: #11161e;
    cursor: pointer;
    transition: .2s;
}

.season:hover {
    background: #171e28;
    border-color: #526a91;
}

.episode-list {
    display: grid;
    gap: 10px;
}

.episode {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: #11161e;
    border: 1px solid #252e3b;
    border-radius: 13px;
    cursor: pointer;
}

.episode:hover {
    border-color: #526a91;
    background: #171e28;
}

.episode-number {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: #1b2432;
    color: #8fb1ff;
    font-weight: 800;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #7f8998;
    border: 1px dashed #303846;
    border-radius: 15px;
}

#playerModal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.player-box {
    width: min(1200px, 100%);
}

.player-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.player-title {
    font-size: 19px;
    font-weight: 700;
}

.close {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #202631;
    color: white;
    font-size: 20px;
}

video {
    width: 100%;
    max-height: 78vh;
    background: black;
    border-radius: 12px;
}

.player-controls {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
}

.player-controls button {
    padding: 11px 16px;
    border-radius: 10px;
    background: #1b2330;
    color: white;
}

.loading {
    padding: 25px;
    color: #8994a5;
}

@media (max-width: 700px) {
    .nav {
        flex-wrap: wrap;
    }

    .search {
        order: 3;
        width: 100%;
        max-width: none;
        margin-left: 0;
    }

    main {
        padding: 25px 15px 60px;
    }

    .page-title {
        font-size: 28px;
    }

    .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .card-body {
        padding: 12px;
    }

    .card-title {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<section id="loginScreen">
    <div class="login-box">
        <div class="logo">MY STREAM</div>
        <div class="subtitle">Private video library</div>

        <input
            id="accessKey"
            type="password"
            placeholder="Enter access key"
            autocomplete="off"
        >

        <button class="primary" id="loginButton">
            Enter Library
        </button>

        <div class="error" id="loginError"></div>
    </div>
</section>

<div id="app" class="hidden">

    <header>
        <div class="nav">
            <div class="brand">MY STREAM</div>

            <input
                class="search"
                id="searchInput"
                placeholder="Search series..."
                autocomplete="off"
            >

            <button class="logout" id="logoutButton">
                Logout
            </button>
        </div>
    </header>

    <main>

        <h1 class="page-title">Your Library</h1>

        <div class="page-description">
            Select a series to browse seasons and episodes.
        </div>

        <div id="seriesSection" class="section">
            <div class="section-title">Series</div>
            <div id="seriesGrid" class="grid"></div>
        </div>

        <div id="seasonSection" class="section hidden">
            <div class="section-title" id="seasonTitle"></div>
            <div id="seasonList" class="season-list"></div>
        </div>

        <div id="episodeSection" class="section hidden">
            <div class="section-title" id="episodeTitle"></div>
            <div id="episodeList" class="episode-list"></div>
        </div>

    </main>
</div>

<div id="playerModal" class="hidden">
    <div class="player-box">

        <div class="player-top">
            <div class="player-title" id="playerTitle">
                Loading...
            </div>

            <button class="close" id="closePlayer">
                ×
            </button>
        </div>

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
        ></video>

        <div class="player-controls">
            <button id="previousEpisode">
                ← Previous
            </button>

            <button id="nextEpisode">
                Next →
            </button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL =
    "https://aqtspzdvfixxljiwkowt.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxdHNwemR2Zml4eGxqaXdrb3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTMzNjEsImV4cCI6MjEwNjY2OTM2MX0.SKtRygN4ott_-NFRCLlebXdcZx-ONqZWS3_2XyMvyBM";

const STREAM_FUNCTION =
    SUPABASE_URL + "/functions/v1/stream-token";

let currentAccessKey = null;
let seriesData = [];
let currentSeries = null;
let currentSeason = null;
let currentEpisodes = [];
let currentEpisodeIndex = -1;

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const accessKeyInput = document.getElementById("accessKey");
const loginButton = document.getElementById("loginButton");
const loginError = document.getElementById("loginError");

const seriesGrid = document.getElementById("seriesGrid");
const seasonSection = document.getElementById("seasonSection");
const seasonTitle = document.getElementById("seasonTitle");
const seasonList = document.getElementById("seasonList");

const episodeSection = document.getElementById("episodeSection");
const episodeTitle = document.getElementById("episodeTitle");
const episodeList = document.getElementById("episodeList");

const searchInput = document.getElementById("searchInput");

const playerModal = document.getElementById("playerModal");
const videoPlayer = document.getElementById("videoPlayer");
const playerTitle = document.getElementById("playerTitle");

const previousEpisode = document.getElementById("previousEpisode");
const nextEpisode = document.getElementById("nextEpisode");

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function validateAccessKey(key) {
    const response = await fetch(
        SUPABASE_URL + "/rest/v1/rpc/validate_access_key",
        {
            method: "POST",
            headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: "Bearer " + SUPABASE_ANON_KEY,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                p_access_key: key
            })
        }
    );

    if (!response.ok) {
        throw new Error("Access-key validation failed");
    }

    return await response.json();
}

async function supabaseGet(path) {
    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: "Bearer " + SUPABASE_ANON_KEY
            }
        }
    );

    if (!response.ok) {
        const error = await response.text();
        console.error(error);
        throw new Error("Database request failed");
    }

    return await response.json();
}

async function loadSeries() {
    seriesGrid.innerHTML =
        '<div class="loading">Loading library...</div>';

    seriesData = await supabaseGet(
        "series?select=id,title,description,poster_url&order=id.asc"
    );

    renderSeries(seriesData);
}

function renderSeries(data) {
    seriesGrid.innerHTML = "";

    if (!data.length) {
        seriesGrid.innerHTML =
            '<div class="empty">No series available.</div>';
        return;
    }

    for (const series of data) {
        const card = document.createElement("div");
        card.className = "card";

        const poster = series.poster_url
            ? `<img class="poster" src="${escapeHTML(series.poster_url)}" alt="">`
            : `<div class="poster"></div>`;

        card.innerHTML = `
            ${poster}
            <div class="card-body">
                <div class="card-title">
                    ${escapeHTML(series.title)}
                </div>
                <div class="card-description">
                    ${escapeHTML(series.description || "")}
                </div>
            </div>
        `;

        card.addEventListener("click", () => {
            openSeries(series);
        });

        seriesGrid.appendChild(card);
    }
}

async function openSeries(series) {
    currentSeries = series;

    seasonSection.classList.remove("hidden");
    episodeSection.classList.add("hidden");

    seasonTitle.textContent =
        series.title + " — Seasons";

    seasonList.innerHTML =
        '<div class="loading">Loading seasons...</div>';

    const seasons = await supabaseGet(
        "seasons?select=id,series_id,season_number,title" +
        "&series_id=eq." +
        encodeURIComponent(series.id) +
        "&order=season_number.asc"
    );

    seasonList.innerHTML = "";

    if (!seasons.length) {
        seasonList.innerHTML =
            '<div class="empty">No seasons available.</div>';
        return;
    }

    for (const season of seasons) {
        const item = document.createElement("div");
        item.className = "season";

        item.innerHTML = `
            <strong>
                Season ${escapeHTML(season.season_number)}
            </strong>
            <div class="card-description">
                ${escapeHTML(season.title || "")}
            </div>
        `;

        item.addEventListener("click", () => {
            openSeason(season);
        });

        seasonList.appendChild(item);
    }

    window.scrollTo({
        top: seasonSection.offsetTop - 80,
        behavior: "smooth"
    });
}

async function openSeason(season) {
    currentSeason = season;

    episodeSection.classList.remove("hidden");

    episodeTitle.textContent =
        `${currentSeries.title} — ${season.title || "Season " + season.season_number}`;

    episodeList.innerHTML =
        '<div class="loading">Loading episodes...</div>';

    currentEpisodes = await supabaseGet(
        "episodes?select=id,season_id,episode_number,title" +
        "&season_id=eq." +
        encodeURIComponent(season.id) +
        "&order=episode_number.asc"
    );

    episodeList.innerHTML = "";

    if (!currentEpisodes.length) {
        episodeList.innerHTML =
            '<div class="empty">No episodes available.</div>';
        return;
    }

    currentEpisodes.forEach((episode, index) => {
        const item = document.createElement("div");
        item.className = "episode";

        item.innerHTML = `
            <div class="episode-number">
                ${escapeHTML(episode.episode_number)}
            </div>

            <div>
                <strong>
                    ${escapeHTML(episode.title)}
                </strong>

                <div class="card-description">
                    Episode ${escapeHTML(episode.episode_number)}
                </div>
            </div>
        `;

        item.addEventListener("click", () => {
            playEpisode(index);
        });

        episodeList.appendChild(item);
    });

    window.scrollTo({
        top: episodeSection.offsetTop - 80,
        behavior: "smooth"
    });
}

async function getSignedVideoURL(episodeId) {
    const response = await fetch(
        STREAM_FUNCTION,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_ANON_KEY,
                Authorization:
                    "Bearer " + SUPABASE_ANON_KEY
            },
            body: JSON.stringify({
                access_key: currentAccessKey,
                episode_id: episodeId
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error || "Unable to authorize video"
        );
    }

    return data.url;
}

async function playEpisode(index) {
    if (
        index < 0 ||
        index >= currentEpisodes.length
    ) {
        return;
    }

    currentEpisodeIndex = index;

    const episode = currentEpisodes[index];

    playerTitle.textContent =
        `${currentSeries.title} — ${episode.title}`;

    playerModal.classList.remove("hidden");

    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();

    try {
        playerTitle.textContent =
            `${currentSeries.title} — ${episode.title} · Authorizing...`;

        const signedURL =
            await getSignedVideoURL(episode.id);

        playerTitle.textContent =
            `${currentSeries.title} — ${episode.title}`;

        videoPlayer.src = signedURL;
        videoPlayer.load();

        await videoPlayer.play();
    } catch (error) {
        console.error(error);

        playerTitle.textContent =
            "Unable to play this episode";

        alert(error.message);
    }

    updateEpisodeButtons();
}

function updateEpisodeButtons() {
    previousEpisode.disabled =
        currentEpisodeIndex <= 0;

    nextEpisode.disabled =
        currentEpisodeIndex >= currentEpisodes.length - 1;
}

previousEpisode.addEventListener("click", () => {
    if (currentEpisodeIndex > 0) {
        playEpisode(currentEpisodeIndex - 1);
    }
});

nextEpisode.addEventListener("click", () => {
    if (
        currentEpisodeIndex <
        currentEpisodes.length - 1
    ) {
        playEpisode(currentEpisodeIndex + 1);
    }
});

function closePlayer() {
    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.load();

    playerModal.classList.add("hidden");
}

document.getElementById("closePlayer")
    .addEventListener("click", closePlayer);

playerModal.addEventListener("click", event => {
    if (event.target === playerModal) {
        closePlayer();
    }
});

loginButton.addEventListener("click", async () => {
    const key = accessKeyInput.value.trim();

    if (!key) {
        loginError.textContent =
            "Enter your access key.";
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Checking...";
    loginError.textContent = "";

    try {
        const valid = await validateAccessKey(key);

        if (!valid) {
            throw new Error("Invalid or expired access key.");
        }

        currentAccessKey = key;

        accessKeyInput.value = "";

        loginScreen.classList.add("hidden");
        app.classList.remove("hidden");

        await loadSeries();
    } catch (error) {
        console.error(error);

        loginError.textContent =
            error.message || "Login failed.";
    }

    loginButton.disabled = false;
    loginButton.textContent = "Enter Library";
});

accessKeyInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        loginButton.click();
    }
});

document.getElementById("logoutButton")
    .addEventListener("click", () => {
        currentAccessKey = null;
        currentSeries = null;
        currentSeason = null;
        currentEpisodes = [];
        currentEpisodeIndex = -1;

        closePlayer();

        app.classList.add("hidden");
        loginScreen.classList.remove("hidden");

        searchInput.value = "";
        seriesGrid.innerHTML = "";
        seasonList.innerHTML = "";
        episodeList.innerHTML = "";

        seasonSection.classList.add("hidden");
        episodeSection.classList.add("hidden");
    });

searchInput.addEventListener("input", () => {
    const query =
        searchInput.value.trim().toLowerCase();

    if (!query) {
        renderSeries(seriesData);
        return;
    }

    const filtered = seriesData.filter(series =>
        String(series.title || "")
            .toLowerCase()
            .includes(query) ||
        String(series.description || "")
            .toLowerCase()
            .includes(query)
    );

    renderSeries(filtered);
});
</script>

</body>
</html>
