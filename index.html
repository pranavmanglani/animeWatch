<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Streaming Service</title>
<meta name="description" content="Private video streaming service">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #08090c;
    --bg2: #101218;
    --card: #151820;
    --card-hover: #1c202a;
    --text: #f5f5f5;
    --muted: #9da3af;
    --accent: #e50914;
    --accent-hover: #ff1e2d;
    --border: rgba(255,255,255,.08);
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background:
        radial-gradient(circle at top, rgba(229,9,20,.18), transparent 40%),
        var(--bg);
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: rgba(21,24,32,.95);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
}

.login-subtitle {
    color: var(--muted);
    margin-bottom: 30px;
    line-height: 1.5;
}

.input {
    width: 100%;
    background: #0d0f14;
    border: 1px solid var(--border);
    color: white;
    padding: 14px 16px;
    border-radius: 10px;
    outline: none;
    transition: .2s;
}

.input:focus {
    border-color: rgba(229,9,20,.7);
    box-shadow: 0 0 0 3px rgba(229,9,20,.1);
}

.primary-btn {
    width: 100%;
    margin-top: 14px;
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    transition: .2s;
}

.primary-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
}

.error {
    color: #ff6870;
    font-size: 14px;
    margin-top: 13px;
    min-height: 20px;
}

#app {
    min-height: 100vh;
}

.navbar {
    height: 70px;
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
    background: rgba(8,9,12,.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

.brand {
    font-size: 21px;
    font-weight: 800;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 14px;
}

.search {
    width: 230px;
    background: #111319;
    border: 1px solid var(--border);
    color: white;
    padding: 10px 14px;
    border-radius: 999px;
    outline: none;
}

.logout {
    border: 1px solid var(--border);
    background: transparent;
    color: white;
    padding: 9px 14px;
    border-radius: 9px;
}

.logout:hover {
    background: rgba(255,255,255,.07);
}

.hero {
    padding: 60px 35px 35px;
    background:
        radial-gradient(circle at 15% 20%, rgba(229,9,20,.15), transparent 35%),
        linear-gradient(180deg, #0c0d11, var(--bg));
}

.hero h1 {
    font-size: clamp(32px, 5vw, 58px);
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 14px;
}

.hero p {
    color: var(--muted);
    max-width: 650px;
    line-height: 1.6;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px 35px 70px;
}

.section-title {
    font-size: 25px;
    margin: 35px 0 18px;
}

.series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.series-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: .25s;
    cursor: pointer;
}

.series-card:hover {
    transform: translateY(-5px);
    background: var(--card-hover);
    border-color: rgba(255,255,255,.14);
}

.poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    background:
        linear-gradient(135deg,#171a22,#0c0d11);
    object-fit: cover;
    display: block;
}

.poster-placeholder {
    width: 100%;
    aspect-ratio: 2 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555b66;
    font-size: 45px;
}

.series-info {
    padding: 15px;
}

.series-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 7px;
}

.series-description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
}

.back-btn {
    border: 1px solid var(--border);
    background: #12151b;
    color: white;
    padding: 9px 15px;
    border-radius: 9px;
    margin-bottom: 25px;
}

.back-btn:hover {
    background: #1a1e26;
}

.season {
    margin-bottom: 35px;
}

.season-title {
    font-size: 21px;
    margin-bottom: 13px;
}

.episode-list {
    display: grid;
    gap: 9px;
}

.episode {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: .2s;
    cursor: pointer;
}

.episode:hover {
    background: var(--card-hover);
    border-color: rgba(255,255,255,.14);
}

.episode-number {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: #0d0f14;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-weight: 700;
    flex-shrink: 0;
}

.episode-name {
    font-weight: 600;
}

.episode-play {
    margin-left: auto;
    color: var(--accent);
    font-weight: 700;
}

.empty {
    color: var(--muted);
    padding: 35px 0;
    text-align: center;
}

.loader {
    display: flex;
    justify-content: center;
    padding: 60px;
}

.spinner {
    width: 38px;
    height: 38px;
    border: 3px solid rgba(255,255,255,.12);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#playerModal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.player-container {
    width: min(1100px, 100%);
}

.player-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.player-title {
    font-size: 19px;
    font-weight: 700;
}

.close-player {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #151820;
    color: white;
    font-size: 20px;
}

video {
    width: 100%;
    max-height: 75vh;
    background: black;
    border-radius: 10px;
    display: block;
}

.player-controls {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    gap: 10px;
}

.player-btn {
    border: 1px solid var(--border);
    background: #151820;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
}

.player-btn:hover {
    background: #20242e;
}

.status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #171a21;
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    z-index: 200;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

@media (max-width: 700px) {
    .navbar {
        height: auto;
        padding: 15px;
        gap: 12px;
        flex-wrap: wrap;
    }

    .nav-right {
        width: 100%;
    }

    .search {
        flex: 1;
        width: auto;
    }

    .hero {
        padding: 40px 20px 25px;
    }

    .container {
        padding: 15px 20px 50px;
    }

    .series-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .series-info {
        padding: 11px;
    }

    .series-title {
        font-size: 14px;
    }

    .series-description {
        font-size: 11px;
    }

    .login-box {
        padding: 25px;
    }
}
</style>
</head>

<body>

<div id="loginScreen">
    <div class="login-box">
        <div class="logo">MY STREAM</div>
        <div class="login-subtitle">
            Enter your access key to continue.
        </div>

        <input
            id="accessKey"
            class="input"
            type="password"
            placeholder="Access key"
            autocomplete="off"
        >

        <button id="loginBtn" class="primary-btn">
            Continue
        </button>

        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="app" class="hidden">

    <nav class="navbar">
        <div class="brand">MY STREAM</div>

        <div class="nav-right">
            <input
                id="searchInput"
                class="search"
                type="search"
                placeholder="Search..."
            >

            <button id="logoutBtn" class="logout">
                Logout
            </button>
        </div>
    </nav>

    <section class="hero">
        <h1>Your Library</h1>
        <p>
            Browse your available series, seasons and episodes.
        </p>
    </section>

    <main class="container">

        <div id="homeView">
            <h2 class="section-title">Series</h2>

            <div id="seriesLoader" class="loader">
                <div class="spinner"></div>
            </div>

            <div id="seriesGrid" class="series-grid"></div>

            <div id="seriesEmpty" class="empty hidden">
                No series found.
            </div>
        </div>

        <div id="seriesView" class="hidden">

            <button id="backBtn" class="back-btn">
                ← Back to series
            </button>

            <div id="seriesDetails"></div>

            <div id="seasonsContainer"></div>

        </div>

    </main>
</div>

<div id="playerModal" class="hidden">

    <div class="player-container">

        <div class="player-top">
            <div id="playerTitle" class="player-title">
                Episode
            </div>

            <button id="closePlayer" class="close-player">
                ×
            </button>
        </div>

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata"
        ></video>

        <div class="player-controls">
            <button id="previousEpisode" class="player-btn">
                ← Previous
            </button>

            <button id="nextEpisode" class="player-btn">
                Next →
            </button>
        </div>

    </div>
</div>

<div id="status" class="status hidden"></div>

<script>
const SUPABASE_URL = "https://aqtspzdvfixxljiwkowt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxdHNwemR2Zml4eGxqaXdrb3d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwOTMzNjEsImV4cCI6MjEwNjY2OTM2MX0.SKtRygN4ott_-NFRCLlebXdcZx-ONqZWS3_2XyMvyBM";

const BUNNY_CDN = "https://pmvids.b-cdn.net";

let accessKey = null;
let allSeries = [];
let currentSeries = null;
let currentEpisodes = [];
let currentEpisodeIndex = -1;

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const accessKeyInput = document.getElementById("accessKey");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

const homeView = document.getElementById("homeView");
const seriesView = document.getElementById("seriesView");

const seriesGrid = document.getElementById("seriesGrid");
const seriesLoader = document.getElementById("seriesLoader");
const seriesEmpty = document.getElementById("seriesEmpty");

const searchInput = document.getElementById("searchInput");
const logoutBtn = document.getElementById("logoutBtn");

const seriesDetails = document.getElementById("seriesDetails");
const seasonsContainer = document.getElementById("seasonsContainer");

const backBtn = document.getElementById("backBtn");

const playerModal = document.getElementById("playerModal");
const videoPlayer = document.getElementById("videoPlayer");
const playerTitle = document.getElementById("playerTitle");
const closePlayer = document.getElementById("closePlayer");

const previousEpisode = document.getElementById("previousEpisode");
const nextEpisode = document.getElementById("nextEpisode");

const statusBox = document.getElementById("status");

function showStatus(message) {
    statusBox.textContent = message;
    statusBox.classList.remove("hidden");

    clearTimeout(window.statusTimer);

    window.statusTimer = setTimeout(() => {
        statusBox.classList.add("hidden");
    }, 2500);
}

function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function supabaseRequest(path, options = {}) {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            ...options,
            headers: {
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        }
    );

    if (!response.ok) {
        const text = await response.text();

        throw new Error(
            "Supabase request failed: " +
            response.status +
            " " +
            text
        );
    }

    return response.json();
}

async function validateAccessKey(key) {

    const now = new Date().toISOString();

    const encodedKey = encodeURIComponent(key);

    const data = await supabaseRequest(
        "access_keys?select=id,access_key,active,expires_at&access_key=eq." +
        encodedKey +
        "&active=eq.true&limit=1"
    );

    if (!data.length) {
        return false;
    }

    const record = data[0];

    if (
        record.expires_at &&
        new Date(record.expires_at) <= new Date(now)
    ) {
        return false;
    }

    return true;
}

async function login() {

    const key = accessKeyInput.value.trim();

    loginError.textContent = "";

    if (!key) {
        loginError.textContent = "Enter your access key.";
        return;
    }

    if (SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") {
        loginError.textContent =
            "Add your Supabase anon/publishable key to index.html first.";
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Checking...";

    try {

        const valid = await validateAccessKey(key);

        if (!valid) {
            loginError.textContent = "Invalid or expired access key.";
            accessKeyInput.value = "";
            return;
        }

        accessKey = key;

        accessKeyInput.value = "";

        loginScreen.classList.add("hidden");
        app.classList.remove("hidden");

        await loadSeries();

    } catch (error) {

        console.error(error);

        loginError.textContent =
            "Unable to connect to the server.";

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Continue";
    }
}

async function loadSeries() {

    seriesLoader.classList.remove("hidden");
    seriesGrid.innerHTML = "";
    seriesEmpty.classList.add("hidden");

    try {

        allSeries = await supabaseRequest(
            "series?select=id,title,description,poster_url&order=id.asc"
        );

        renderSeries(allSeries);

    } catch (error) {

        console.error(error);

        seriesEmpty.textContent =
            "Unable to load series.";

        seriesEmpty.classList.remove("hidden");

    } finally {

        seriesLoader.classList.add("hidden");
    }
}

function renderSeries(seriesList) {

    seriesGrid.innerHTML = "";

    if (!seriesList.length) {

        seriesEmpty.textContent =
            "No series available.";

        seriesEmpty.classList.remove("hidden");

        return;
    }

    seriesEmpty.classList.add("hidden");

    seriesList.forEach(series => {

        const card = document.createElement("div");

        card.className = "series-card";

        let visual = "";

        if (series.poster_url) {

            visual = `
                <img
                    class="poster"
                    src="${escapeHTML(series.poster_url)}"
                    alt="${escapeHTML(series.title)}"
                    loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.classList.remove('hidden')"
                >
                <div class="poster-placeholder hidden">
                    ▶
                </div>
            `;

        } else {

            visual = `
                <div class="poster-placeholder">
                    ▶
                </div>
            `;
        }

        card.innerHTML = `
            ${visual}

            <div class="series-info">

                <div class="series-title">
                    ${escapeHTML(series.title)}
                </div>

                <div class="series-description">
                    ${escapeHTML(series.description || "")}
                </div>

            </div>
        `;

        card.addEventListener("click", () => {
            openSeries(series);
        });

        seriesGrid.appendChild(card);
    });
}

async function openSeries(series) {

    currentSeries = series;

    homeView.classList.add("hidden");
    seriesView.classList.remove("hidden");

    seriesDetails.innerHTML = `
        <h1 style="font-size:32px;margin-bottom:10px;">
            ${escapeHTML(series.title)}
        </h1>

        <p style="color:var(--muted);line-height:1.6;margin-bottom:30px;">
            ${escapeHTML(series.description || "")}
        </p>
    `;

    seasonsContainer.innerHTML = `
        <div class="loader">
            <div class="spinner"></div>
        </div>
    `;

    try {

        const seasons = await supabaseRequest(
            "seasons?select=id,series_id,season_number,title&series_id=eq." +
            encodeURIComponent(series.id) +
            "&order=season_number.asc"
        );

        await renderSeasons(seasons);

    } catch (error) {

        console.error(error);

        seasonsContainer.innerHTML = `
            <div class="empty">
                Unable to load seasons.
            </div>
        `;
    }
}

async function renderSeasons(seasons) {

    seasonsContainer.innerHTML = "";

    if (!seasons.length) {

        seasonsContainer.innerHTML = `
            <div class="empty">
                No seasons available.
            </div>
        `;

        return;
    }

    for (const season of seasons) {

        const seasonElement = document.createElement("div");

        seasonElement.className = "season";

        seasonElement.innerHTML = `
            <div class="season-title">
                ${escapeHTML(
                    season.title ||
                    "Season " + season.season_number
                )}
            </div>

            <div class="episode-list">
                <div class="empty">
                    Loading episodes...
                </div>
            </div>
        `;

        seasonsContainer.appendChild(seasonElement);

        try {

            const episodes = await supabaseRequest(
                "episodes?select=id,season_id,episode_number,title,stream_url&season_id=eq." +
                encodeURIComponent(season.id) +
                "&order=episode_number.asc"
            );

            const list = seasonElement.querySelector(
                ".episode-list"
            );

            list.innerHTML = "";

            if (!episodes.length) {

                list.innerHTML = `
                    <div class="empty">
                        No episodes available.
                    </div>
                `;

                continue;
            }

            episodes.forEach((episode, index) => {

                const item = document.createElement("div");

                item.className = "episode";

                item.innerHTML = `
                    <div class="episode-number">
                        ${escapeHTML(episode.episode_number)}
                    </div>

                    <div class="episode-name">
                        ${escapeHTML(episode.title)}
                    </div>

                    <div class="episode-play">
                        ▶
                    </div>
                `;

                item.addEventListener("click", () => {

                    currentEpisodes = episodes;
                    currentEpisodeIndex = index;

                    playEpisode(episode);
                });

                list.appendChild(item);
            });

        } catch (error) {

            console.error(error);

            seasonElement.querySelector(
                ".episode-list"
            ).innerHTML = `
                <div class="empty">
                    Failed to load episodes.
                </div>
            `;
        }
    }
}

function getBunnyURL(streamURL) {

    if (!streamURL) return null;

    if (
        streamURL.startsWith("http://") ||
        streamURL.startsWith("https://")
    ) {
        return streamURL;
    }

    return (
        BUNNY_CDN.replace(/\/$/, "") +
        "/" +
        streamURL.replace(/^\//, "")
    );
}

function playEpisode(episode) {

    const url = getBunnyURL(episode.stream_url);

    if (!url) {

        showStatus(
            "This episode does not have a video."
        );

        return;
    }

    playerTitle.textContent =
        "Episode " +
        episode.episode_number +
        " — " +
        episode.title;

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    videoPlayer.load();

    videoPlayer.src = url;

    playerModal.classList.remove("hidden");

    videoPlayer.play().catch(() => {});
}

function closeVideo() {

    videoPlayer.pause();

    videoPlayer.removeAttribute("src");

    videoPlayer.load();

    playerModal.classList.add("hidden");
}

function playRelativeEpisode(direction) {

    if (!currentEpisodes.length) return;

    const newIndex =
        currentEpisodeIndex + direction;

    if (
        newIndex < 0 ||
        newIndex >= currentEpisodes.length
    ) {
        showStatus(
            direction > 0
                ? "This is the last episode."
                : "This is the first episode."
        );

        return;
    }

    currentEpisodeIndex = newIndex;

    playEpisode(
        currentEpisodes[currentEpisodeIndex]
    );
}

function logout() {

    accessKey = null;
    currentSeries = null;
    currentEpisodes = [];
    currentEpisodeIndex = -1;

    closeVideo();

    app.classList.add("hidden");
    loginScreen.classList.remove("hidden");

    accessKeyInput.value = "";
    loginError.textContent = "";

    allSeries = [];
    seriesGrid.innerHTML = "";
}

backBtn.addEventListener("click", () => {

    seriesView.classList.add("hidden");
    homeView.classList.remove("hidden");

    currentSeries = null;
});

loginBtn.addEventListener("click", login);

accessKeyInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        login();
    }
});

logoutBtn.addEventListener("click", logout);

closePlayer.addEventListener("click", closeVideo);

previousEpisode.addEventListener(
    "click",
    () => playRelativeEpisode(-1)
);

nextEpisode.addEventListener(
    "click",
    () => playRelativeEpisode(1)
);

playerModal.addEventListener("click", event => {

    if (event.target === playerModal) {
        closeVideo();
    }
});

document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        !playerModal.classList.contains("hidden")
    ) {
        closeVideo();
    }
});

searchInput.addEventListener("input", () => {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    if (!query) {

        renderSeries(allSeries);

        return;
    }

    const filtered = allSeries.filter(series => {

        return (
            (series.title || "")
                .toLowerCase()
                .includes(query) ||

            (series.description || "")
                .toLowerCase()
                .includes(query)
        );
    });

    renderSeries(filtered);
});
</script>

</body>
</html>
